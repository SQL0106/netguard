[workspace]
resolver = "2"
members = ["crates/core", "crates/win"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/SQL0106/netguard"
rust-version = "1.75"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
